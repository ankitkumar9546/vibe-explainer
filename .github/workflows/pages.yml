name: Demo site
on:
  push:
    branches: [main]
    paths: ["demo/**", "packages/console/**", "scripts/assemble-site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # GitHub Pages on a free account needs a public repo; until then this job is skipped.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/assemble-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub sometimes lists a just-uploaded artifact a few seconds late ("No artifacts named github-pages").
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
