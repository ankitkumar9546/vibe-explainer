<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibe-explainer console (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>(function(){var t=null;try{t=localStorage.getItem("vx-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var h=location.hash;if(h.indexOf("dark")>=0)t="dark";if(h.indexOf("light")>=0)t="light";document.documentElement.dataset.theme=t;})();</script>
<style>
:root{
  --ground:#FFDCC8; --ground-2:#FFC9AE; --card:#FFFFFF;
  --ink:#2A1B3D; --ink-2:#5E5170; --ink-3:#7A6E8C; --line:#F3E1D3; --line-2:#E9D3C2;
  --action:#6B3BFF; --action-hover:#5A2BF0; --action-wash:#EEE7FF; --on-action:#FFFFFF;
  --soch:#D4E8FF; --soch-ink:#1D4C85;
  --read:#CDF1DA; --read-ink:#17643B;
  --edit:#FFE17E; --edit-ink:#6E5200;
  --run:#FFCDB8; --run-ink:#86320F;
  --ok:#CDF1DA; --ok-ink:#17643B;
  --unk:#FFF0B8; --unk-ink:#6E5200;
  --bad:#FFD9DC; --bad-ink:#B4182B; --bad-solid:#E5394D;
  --live:#FF5A5F;
  --add:#DDF6E6; --add-ink:#17643B; --del:#FFE5E7;
  --track:#FFFBF7; --chip:#FFF1E8; --fp:#FBF9FF; --field:#FFFFFF; --addhover:#CBEFD9; --livering:#FFE0E1;
  --r:22px; --r-s:14px;
  --head:"Baloo 2",system-ui,sans-serif;
  --sans:"Nunito",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 2px 0 rgba(42,27,61,.04),0 10px 24px -14px rgba(42,27,61,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--action-wash);color:var(--ink)}
:focus-visible{outline:3px solid var(--action);outline-offset:3px;border-radius:10px}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--ground)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.84em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.press{transition:transform .35s var(--spring)}
button:active:not(:disabled){transform:scale(.97)}
button{transition:transform .35s var(--spring),background-color .2s,border-color .2s,color .2s}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--head);letter-spacing:-.01em}
.mark .box{width:34px;height:34px;border-radius:11px;background:var(--ink);display:grid;place-items:center;transform:rotate(-6deg)}
.mark .box i{width:12px;height:12px;border-radius:4px;background:var(--edit)}.turn .n,.feed .tx code,.impact .where,.strip h2 .num{background:var(--chip)}
.proj{color:var(--ink-2);font-size:15px;font-weight:600}
.proj b{color:var(--ink)}
.demo{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--card);padding:4px 10px;border-radius:999px;border:1.5px dashed var(--line-2)}
.spacer{flex:1}
.rec{display:flex;align-items:center;gap:8px;font:700 14px var(--sans);padding:7px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px var(--livering)}
.rec.off{opacity:.7}.rec.off i{background:var(--ink-3);box-shadow:none}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink);background:var(--action-wash)}

/* ---------- timeline card ---------- */
.strip{margin:0 28px 20px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 22px 16px;display:grid;grid-template-columns:130px minmax(0,1fr);gap:0 16px}
.strip h2{grid-column:1/-1;margin:0 0 12px;font:700 15px var(--sans);color:var(--ink-2);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.strip h2 b{font:700 18px/1.25 var(--head);color:var(--ink);overflow-wrap:anywhere}
.strip h2 .num{background:var(--ground);padding:2px 10px;border-radius:999px;font-size:13px}
.strip .follow{margin-left:auto;border:0;background:var(--action);color:var(--on-action);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;display:none}
.strip .follow.show{display:inline-block}
.chans{display:grid;grid-template-rows:repeat(4,32px);font-size:14px;font-weight:700}
.chans div{display:flex;align-items:center;gap:8px;padding:0 10px;margin:3px 0;border-radius:10px}
.chans div:nth-child(1){background:var(--soch);color:var(--soch-ink)}
.chans div:nth-child(2){background:var(--read);color:var(--read-ink)}
.chans div:nth-child(3){background:var(--edit);color:var(--edit-ink)}
.chans div:nth-child(4){background:var(--run);color:var(--run-ink)}
.trace{position:relative;height:128px;touch-action:none;cursor:ew-resize;border-radius:14px;background:
  repeating-linear-gradient(to right,transparent 0,transparent calc(var(--major) - 2px),var(--line) calc(var(--major) - 2px),var(--line) var(--major));
  background-color:var(--track);--minor:0px}
.tick{position:absolute;height:22px;margin-top:5px;border-radius:999px;min-width:10px}
.tick.soch{background:var(--soch);box-shadow:inset 0 0 0 2px #A9CDF5}
.tick.read{background:var(--read);box-shadow:inset 0 0 0 2px #99DDB3}
.tick.edit{background:var(--edit);box-shadow:inset 0 0 0 2px #F2C53A}
.tick.run{background:var(--run);box-shadow:inset 0 0 0 2px #F5A27F}
.tick.bad{background:var(--bad-solid);box-shadow:none}
.tick.future{opacity:.3}
.cursor{position:absolute;top:-8px;bottom:-8px;width:0;border-left:3px solid var(--action);pointer-events:none;transition:left .5s var(--spring);margin-left:-1.5px}
.cursor::before{content:"";position:absolute;top:-6px;left:-9px;width:15px;height:15px;border-radius:50%;background:var(--action);box-shadow:0 0 0 4px var(--action-wash)}
.cursor.live{border-color:var(--live)}.cursor.live::before{background:var(--live);box-shadow:0 0 0 4px var(--livering)}
.trace.drag .cursor{transition:none}
@media (prefers-reduced-motion:reduce){.cursor,button{transition:none}}
.scale{grid-column:2;position:relative;height:22px;font:600 12px var(--mono);color:var(--ink-3);margin-top:10px}
.scale span{position:absolute;top:0;transform:translateX(-50%)}.scale span:first-child{transform:none}
.pin{position:absolute;bottom:-9px;width:16px;height:16px;transform:translateX(-50%);border-radius:50%;border:2.5px solid var(--card);pointer-events:none}
.pin.ok{background:#2FBF6B}.pin.unk{background:#F2C53A}.pin.bad{background:var(--bad-solid)}
.chanic{position:absolute;left:-30px;display:none;pointer-events:none;line-height:0;padding:3px;border-radius:8px}
.chanic:nth-of-type(1){}

/* ---------- body ---------- */
.body{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;padding:0 28px 60px}
.rail{display:flex;flex-direction:column;gap:10px}
.rail h3{margin:4px 6px 2px;font:700 14px var(--sans);color:var(--ink-2)}
#turns{display:flex;flex-direction:column;gap:10px}
.turn{display:grid;grid-template-columns:36px 1fr;gap:4px 10px;width:100%;text-align:left;border:0;background:var(--card);padding:14px 16px;cursor:pointer;border-radius:18px;box-shadow:var(--shadow);border:2px solid transparent}
.turn:hover{border-color:var(--line-2)}
.turn[aria-current="true"]{border-color:var(--action);box-shadow:0 0 0 4px var(--action-wash),var(--shadow)}
.turn .n{width:32px;height:32px;border-radius:10px;background:var(--ground);display:grid;place-items:center;font:800 15px var(--head);color:var(--ink-2)}
.turn[aria-current="true"] .n{background:var(--action);color:var(--on-action)}
.turn .p{font-size:15px;line-height:1.35;font-weight:700;padding-top:4px}
.turn .meta{grid-column:2;font-size:13px;color:var(--ink-3);display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;font-weight:600}
.turn .meta .dot{width:8px;height:8px;border-radius:50%;background:var(--live)}
.turn .meta .donetag{display:inline-flex;align-items:center;gap:3px;color:var(--ok-ink);background:var(--ok);padding:0 8px;border-radius:999px;font-weight:800}.turn .meta .donetag .i{width:12px;height:12px;stroke-width:3}
.turn .meta .flag{color:var(--bad-ink);background:var(--bad);padding:0 8px;border-radius:999px;font-weight:800;white-space:nowrap}
.overviewbtn{font-size:15px;font-weight:700;border:2px dashed var(--line-2);background:transparent;border-radius:18px;padding:12px 16px;text-align:left;cursor:pointer;color:var(--ink-2)}
.overviewbtn:hover{background:var(--card)}
.overviewbtn[aria-current="true"]{background:var(--action);color:var(--on-action);border-color:var(--action)}

.report{min-width:0}
.prompt{font:800 34px/1.12 var(--head);letter-spacing:-.02em;margin:6px 0 8px;max-width:30ch;overflow-wrap:anywhere}
.prompt-meta{color:var(--ink-2);font-size:15px;font-weight:600;margin-bottom:22px}

/* findings = claim cards */
.findings{margin-bottom:26px}
.findings h4{margin:0 0 12px;font:800 22px var(--head)}
.findings{display:block}
.claimrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.claim{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;border:2px solid transparent}
.claim.bad{border-color:var(--bad-solid);background:linear-gradient(var(--card),var(--card)) padding-box}
.stampx{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:800 13px var(--sans);padding:5px 12px 5px 8px;border-radius:999px;white-space:nowrap}
.stampx .i{width:16px;height:16px;stroke-width:2.6}
.stampx.ok{background:var(--ok);color:var(--ok-ink)}
.stampx.unk{background:var(--unk);color:var(--unk-ink)}
.stampx.bad{background:var(--bad-solid);color:#fff}
.claim .k{font:800 13px var(--head);color:var(--ink-3);margin-right:6px}
.claim q{font:700 18px/1.35 var(--head);quotes:"“" "”"}
.claim .ev{font-size:14px;color:var(--ink-2);line-height:1.5}
.claim .ev a{color:var(--action);font-weight:800;text-decoration:none;cursor:pointer;display:inline-block;margin-top:4px}
.claim .ev a:hover{text-decoration:underline;text-underline-offset:3px}
.findings .pending{background:var(--card);border-radius:var(--r);padding:20px;color:var(--ink-2);box-shadow:var(--shadow);font-weight:600}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:22px;overflow-x:auto;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:9px 16px;font-size:15px;font-weight:800;cursor:pointer;color:var(--ink-2);border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--action);color:var(--on-action)}
.tabs button:hover:not([aria-selected="true"]){background:var(--action-wash);color:var(--ink)}
.panel{animation:in .45s var(--ease)}
@keyframes in{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px}
.muted{color:var(--ink-2)}
.empty{background:var(--card);border-radius:var(--r);padding:26px;color:var(--ink-2);max-width:62ch;box-shadow:var(--shadow);font-weight:600;font-size:17px}

/* live */
.now{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:22px 24px;border-radius:var(--r);margin-bottom:16px;background:var(--soch)}
.now.ch-read{background:var(--read)}.now.ch-edit{background:var(--edit)}.now.ch-run{background:var(--run)}.now.ch-msg,.now.ch-prompt{background:var(--card);box-shadow:var(--shadow)}
.now.bad{background:var(--bad)}
.now .t{font:700 14px var(--mono);color:var(--ink);background:rgba(255,255,255,.65);padding:4px 10px;border-radius:999px;margin-top:4px}
.now .what{font:700 26px/1.3 var(--head);max-width:38ch}
.now .what code{font-size:.62em;background:rgba(255,255,255,.7);padding:2px 8px;border-radius:8px;vertical-align:middle}
.now .why{grid-column:2;color:var(--ink);opacity:.85;max-width:62ch;font-weight:600}
.feed{list-style:none;margin:0;padding:8px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.feed li{display:grid;grid-template-columns:58px 34px 1fr;gap:10px;padding:10px 12px;border-radius:14px;align-items:center}
.feed li+li{margin-top:2px}
.feed li.future{opacity:.35}
.feed li.at{background:var(--action-wash)}
.feed .t{font:600 13px var(--mono);color:var(--ink-3)}
.feed .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soch);color:var(--soch-ink)}
.feed li.ev-read .ic{background:var(--read);color:var(--read-ink)}
.feed li.ev-edit .ic{background:var(--edit);color:var(--edit-ink)}
.feed li.ev-run .ic{background:var(--run);color:var(--run-ink)}
.feed li.ev-msg .ic,.feed li.ev-prompt .ic{background:var(--ground);color:var(--ink)}
.feed .ic .i{width:16px;height:16px}
.feed .tx{overflow-wrap:anywhere;font-weight:600}
.feed .tx code{background:var(--ground);padding:2px 7px;border-radius:7px}
.feed .sub{font-size:13px;color:var(--ink-3);font-weight:700}
.feed li.ev-soch .tx{font-style:italic;color:var(--ink-2);font-weight:400}
.feed li.ev-msg .tx{font-weight:800}

/* logs */
.logwrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 18px;overflow-x:auto}
table.log{width:100%;border-collapse:collapse;font-size:14px}
.log th{text-align:left;font-weight:800;color:var(--ink-3);font-size:13px;padding:10px 12px 10px 0;border-bottom:2px solid var(--line)}
.log td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.log tr:last-child td{border-bottom:0}
.log td.t{font-family:var(--mono);color:var(--ink-3);white-space:nowrap}
.log td.tool span{display:inline-block;font:800 12px var(--sans);padding:3px 10px;border-radius:999px;background:var(--soch);color:var(--soch-ink)}
.log td.tool.tool-read span{background:var(--read);color:var(--read-ink)}
.log td.tool.tool-edit span{background:var(--edit);color:var(--edit-ink)}
.log td.tool.tool-run span{background:var(--run);color:var(--run-ink)}
.log td.tool.tool-msg span,.log td.tool.tool-prompt span{background:var(--ground);color:var(--ink)}
.log tr.future td{opacity:.35}
.log summary{color:var(--action);font-weight:800;margin-top:4px}
.log pre{margin:8px 0 0;background:var(--ink);color:#F4EEFF;padding:12px 14px;border-radius:12px;font:12.5px/1.55 var(--mono);overflow:auto}
.res-ok{color:var(--ok-ink);font-weight:800}.res-x{color:var(--bad-ink);font-weight:800}

/* changes */
.files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.files button{border:2px solid var(--line-2);background:var(--card);border-radius:999px;padding:7px 14px;font:600 13px var(--mono);cursor:pointer}
.files button:hover{border-color:var(--action)}
.files button[aria-pressed="true"]{border-color:var(--action);background:var(--action);color:var(--on-action)}
.files .c{font-size:12px;margin-left:6px;opacity:.85}
.diffwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.diffhead{grid-column:1/-1;display:flex;gap:12px;align-items:center;font-size:15px;flex-wrap:wrap}
.diffhead code{font-weight:700;font-size:15px}
.newfile{font:800 12px var(--sans);color:var(--add-ink);background:var(--add);padding:3px 10px;border-radius:999px}
.hunk{display:contents}
.code{font:13px/1.75 var(--mono);padding:12px 0;overflow-x:auto;min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.code div{padding:0 16px;white-space:pre;display:flex;gap:12px}
.code .ln{color:var(--ink-3);width:2.5ch;text-align:right;flex:none;user-select:none}
.code .add{background:var(--add)}
.code .add .sg{color:var(--add-ink);font-weight:700}
.code .del{background:var(--del);color:var(--ink-3)}.code .del > span:nth-child(3){text-decoration:line-through;text-decoration-color:var(--bad-ink)}
.code .sg{width:1ch;flex:none;user-select:none}
.hataya{font:800 10px var(--sans);letter-spacing:.04em;background:var(--bad-ink);color:#fff;padding:1px 7px;border-radius:999px;text-decoration:none;display:inline-block;margin-left:8px}
.note{align-self:start;position:relative;padding:16px 18px;border-radius:var(--r);background:var(--edit);color:var(--ink);font-size:16px;font-weight:600}
.note::before{content:"";position:absolute;left:-8px;top:22px;width:16px;height:16px;background:inherit;transform:rotate(45deg);border-radius:3px}
.note b{display:block;margin-bottom:4px;font:800 16px var(--head)}

/* wiring */
.wire{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;overflow-x:auto}
.wire svg{display:block;min-width:640px;width:100%;height:auto}
.wire .node rect{fill:var(--track);stroke:var(--line-2);stroke-width:2}
.wire .node.changed rect{fill:var(--edit);stroke:#F2C53A}
.wire .node.new rect{fill:var(--add);stroke:#59C98A;stroke-width:2.5}
.wire .node.risk rect{fill:var(--bad);stroke:var(--bad-solid);stroke-width:2.5;stroke-dasharray:7 4}
.wire .node text{font:700 14px var(--mono);fill:var(--ink)}
.wire .node .k{font:700 11px var(--sans);fill:var(--ink-2)}
.wire .edge{stroke:#C9B8AA;stroke-width:2;fill:none}
.wire .edge.new{stroke:#2FBF6B;stroke-width:3}
.wire .node{cursor:pointer}
.wire .node:hover rect{stroke:var(--action)}
.wire .node.dim{opacity:.25}.wire .edge.dim{opacity:.12}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--ink-2);margin:14px 0 0}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:20px;height:13px;border-radius:5px;border:2px solid var(--line-2);background:var(--track);display:inline-block}
.legend i.n{background:var(--add);border-color:#59C98A}
.legend i.r{background:var(--bad);border:2px dashed var(--bad-solid)}
.wire-info{margin-top:14px;max-width:62ch;min-height:3em;background:var(--card);border-radius:var(--r-s);padding:12px 16px;box-shadow:var(--shadow)}

/* impact */
.impact{list-style:none;padding:0;margin:0;max-width:900px;display:flex;flex-direction:column;gap:14px}
.impact li{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:20px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.rlevel{font:800 14px var(--head);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rlevel{color:var(--ink)}
.meter{display:flex;gap:4px}.meter i{width:24px;height:10px;background:var(--ground-2);border-radius:999px}
.meter.l1 i:nth-child(-n+1){background:#2FBF6B}
.meter.l2 i:nth-child(-n+2){background:#F2A93A}
.meter.l3 i:nth-child(-n+3){background:var(--bad-solid)}
.impact h5{margin:0 0 4px;font:800 20px/1.25 var(--head)}
.impact .where{font:600 13px var(--mono);color:var(--ink-2);margin-bottom:8px;background:var(--ground);display:inline-block;padding:2px 10px;border-radius:8px}
.impact .fix{font-size:15px;margin-top:10px;background:var(--action-wash);padding:10px 14px;border-radius:12px}
.impact .fix b{color:var(--action)}

/* seekho */
.lesson{max-width:74ch;display:flex;flex-direction:column;gap:14px}
.lesson > .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px}
.lesson > .card.hero{background:var(--action);color:var(--on-action)}
.lesson > .card.hero h5{color:#D9CCFF}
.lesson h5{font:800 20px var(--head);margin:0 0 8px;color:var(--ink)}
.lesson p{margin:0 0 8px;font-size:17px}
.lesson .big{font:700 24px/1.35 var(--head);margin:0}
.lesson .steps{display:flex;flex-direction:column;gap:10px;margin:0}
.lesson .steps p{background:var(--ground);border-radius:14px;padding:12px 16px;margin:0;font-weight:600}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ba div{padding:16px 18px;border-radius:16px;background:var(--del);font-weight:600}.ba div+div{background:var(--add)}
.ba b{display:block;font:800 14px var(--head);color:var(--ink-2);margin-bottom:4px}
.concepts{display:flex;flex-wrap:wrap;gap:10px}
.concepts details{background:var(--soch);border-radius:16px;padding:10px 16px;flex:1 1 200px}
.concepts details[open]{background:var(--card);box-shadow:inset 0 0 0 2px var(--soch)}
.concepts summary,.log summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.concepts summary{font-weight:800;color:var(--soch-ink)}
summary::-webkit-details-marker{display:none}summary .i{transition:transform .25s var(--spring);width:16px;height:16px}details[open]>summary .i{transform:rotate(90deg)}
.concepts details[open] > :not(summary){margin-top:6px}
.quiz{border-top:0}
.q{padding:16px 0;border-top:2px dashed var(--line)}
.q:first-of-type{border-top:0}
.q p{font:800 18px/1.35 var(--head);margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;border:2px solid var(--line-2);background:var(--card);border-radius:14px;padding:12px 16px;cursor:pointer;font-size:16px;font-weight:700;border-bottom-width:4px}
.opts button:hover:not(:disabled){border-color:var(--action);color:var(--action)}
.opts button.right{border-color:#2FBF6B;background:var(--ok);color:var(--ok-ink)}
.opts button.wrong{border-color:var(--bad-solid);background:var(--bad);color:var(--bad-ink);text-decoration:line-through}
.opts button:disabled{cursor:default}
.qexp{font-size:15px;color:var(--ink-2);margin-top:10px;font-weight:600}
.score{display:inline-block;font:800 16px var(--head);margin-top:12px;background:var(--edit);padding:6px 16px;border-radius:999px}
.explain-back textarea{width:100%;min-height:96px;font:16px var(--sans);padding:14px 16px;border:2px solid var(--line-2);border-radius:16px;background:var(--track);resize:vertical;color:var(--ink)}
.explain-back textarea:focus{border-color:var(--action);outline:none}
.explain-back button{margin-top:10px;border:0;background:var(--action);color:var(--on-action);padding:12px 20px;border-radius:999px;cursor:pointer;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--action-hover)}
.explain-back button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* overview */
.areas{list-style:none;padding:0;margin:0;max-width:860px;display:flex;flex-direction:column;gap:10px}
.areas li{display:grid;grid-template-columns:200px 1fr 110px;gap:16px;padding:16px 20px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);align-items:center;font-weight:600}
.areas code{font-weight:700}
.bar{display:flex;gap:3px;flex-wrap:wrap}.bar i{width:12px;height:16px;background:var(--ground-2);border-radius:4px}.bar i.t{background:var(--edit);box-shadow:inset 0 0 0 2px #F2C53A}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 22px;max-width:860px}
.facts div{display:flex;flex-direction:column;padding:16px 18px;border-radius:18px;background:var(--soch)}
.facts div:nth-child(2){background:var(--edit)}.facts div:nth-child(3){background:var(--bad)}.facts div:nth-child(4){background:var(--read)}
.facts b{font:800 32px/1.1 var(--head)}
.facts span{font-size:14px;font-weight:700;color:var(--ink-2)}

/* responsive */
@media (max-width:900px){
  .top{padding:12px 16px;gap:10px}
  .proj{display:none}.top .spacer{display:none}
  .strip{margin:0 16px 16px;grid-template-columns:minmax(0,1fr);padding:14px 14px 12px 14px}
  .chans{display:none}
  .trace{margin-left:34px}.scale{grid-column:1;margin-left:34px}
  .chanic{display:block}
  .body{grid-template-columns:minmax(0,1fr);padding:0 16px 110px;gap:14px}
  .rail{flex-direction:row;overflow-x:auto;padding:4px 2px 8px}
  .rail h3{display:none}
  #turns{flex-direction:row}
  .turn{min-width:250px;align-content:start}
  .overviewbtn{min-width:130px}
  .prompt{font-size:27px}
  .tabs{position:fixed;left:10px;right:10px;bottom:10px;z-index:10;width:auto;justify-content:space-between;border-radius:22px;padding:6px;gap:2px;box-shadow:0 10px 30px -8px rgba(42,27,61,.35)}
  .tabs button{flex-direction:column;gap:2px;padding:7px 4px;font-size:11px;flex:1;border-radius:16px}
  .diffwrap{grid-template-columns:minmax(0,1fr)}
  .note::before{left:26px;top:-7px}
  .claimrow{grid-template-columns:1fr}
  .areas li{grid-template-columns:1fr;gap:6px}
  .impact li{grid-template-columns:1fr;gap:10px}
  .ba{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .now .what{font-size:21px}
}

.chanic.ch-soch{background:var(--soch);color:var(--soch-ink)}.chanic.ch-read{background:var(--read);color:var(--read-ink)}
.chanic.ch-edit{background:var(--edit);color:var(--edit-ink)}.chanic.ch-run{background:var(--run);color:var(--run-ink)}

/* ===== round 3: guided layout + features ===== */
.report .strip{margin:0 0 18px}
.strip.mini{grid-template-columns:minmax(0,1fr);padding:12px 18px 12px}
.strip.mini .chans{display:none}
.strip.mini .trace{height:40px;margin-left:0}
.strip.mini .tick{top:8px!important;height:16px;margin-top:4px}
.strip.mini .chanic{display:none!important}
.strip.mini .scale{grid-column:1;margin-left:0;margin-top:8px}
.strip.mini h2{margin-bottom:8px}
.strip h2 .tlname{font:800 16px var(--head);color:var(--ink)}
.strip h2 .grow{flex:1}
.ghost{border:2px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ghost:hover{border-color:var(--action);color:var(--action)}
.primary{border:0;background:var(--action);color:var(--on-action);border-radius:999px;padding:11px 20px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 0 #4B22C9}
.primary:hover{background:var(--action-hover)}
.primary:disabled{opacity:.7;cursor:progress}
.sm{padding:7px 14px;font-size:14px}.primary.sm{box-shadow:0 3px 0 #4B22C9}
.livetag{color:#C2272D;font-weight:800}
.hint{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:700;margin:0 0 14px}

/* claims: one line */
.cbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:var(--r);padding:12px 14px 12px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-weight:700}
.cbar>.i{width:22px;height:22px;color:#17643B;stroke-width:2.6}
.cbar.mix>.i{color:var(--unk-ink)}
.cbar.pending{color:var(--ink-2)}.cbar.pending>.i{color:var(--live)}
.cbar>span:first-of-type{flex:1;min-width:180px}
.cpills{display:inline-flex;gap:6px;flex:none!important;min-width:0!important}
.cpills .stampx{padding:3px 10px 3px 6px;font-size:13px}
.alert{background:var(--card);border:2.5px solid var(--bad-solid);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.alert-top{display:flex;gap:14px;align-items:flex-start}
.alert-ic{flex:none;width:36px;height:36px;border-radius:12px;background:var(--bad-solid);color:#fff;display:grid;place-items:center}
.alert-ic .i{stroke-width:3}
.alert p{margin:2px 0 0;font-size:17px;font-weight:700;line-height:1.45}
.alert q{font-family:var(--head);font-weight:800}
.alert .muted{display:block;font-size:14px;font-weight:600;margin-top:4px}
.alert-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 0 50px}
.alert-actions .cpills{margin-left:auto}
.spin{width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.testres{margin:14px 0 0 50px;background:var(--bad);border-radius:16px;padding:14px 16px;animation:in .45s var(--ease)}
.testres b{font:800 14px var(--mono)}
.testres p{font-size:15px;margin:6px 0 10px}
.testres pre{margin:0;background:var(--ink);color:#F4EEFF;border-radius:12px;padding:12px 14px;font:12.5px/1.55 var(--mono);overflow:auto}
.findings{margin:-4px 0 18px}

/* sticky nav: stepper + tabs */
#nav{position:sticky;top:0;z-index:8;padding:10px 0 12px;background:linear-gradient(var(--ground) 82%,transparent)}
#nav .tabs{margin-bottom:0}
.stepper{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px;box-shadow:var(--shadow);position:relative;width:max-content;max-width:100%;overflow-x:auto}
.stepchip{border:0;background:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;cursor:pointer;font-weight:800;color:var(--ink-2);white-space:nowrap}
.stepchip .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ground);font:800 14px var(--head);color:var(--ink-2)}
.stepchip .sn .i{width:15px;height:15px;stroke-width:2.6}
.stepchip.done .sn{background:var(--ok);color:var(--ok-ink)}
.stepchip.on{background:var(--action);color:var(--on-action)}
.stepchip.on .sn{background:#fff;color:var(--action)}
.stepchip:hover:not(.on){background:var(--action-wash);color:var(--ink)}
.stepper .bar{position:absolute;left:22px;right:22px;bottom:2px;height:3px;border-radius:3px;background:transparent;pointer-events:none}
.stepper .bar i{display:block;height:100%;background:#2FBF6B;border-radius:3px;transition:width .5s var(--spring)}
.strip[hidden]{display:none}
.stepnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.subhead{font:800 22px var(--head);margin:26px 0 12px}
.sechead{font:800 26px var(--head);margin:34px 0 4px}

/* fix prompt */
.fixprompt{margin-top:12px;border:2px dashed #C9B6FF;border-radius:16px;padding:12px 14px;background:var(--fp)}
.fp-head{display:flex;align-items:center;gap:6px;font:800 14px var(--head);color:var(--action)}
.fixprompt p{margin:6px 0 10px;font:600 14.5px/1.5 var(--sans)}

/* ask a line */
.code .line{cursor:pointer;position:relative}
.code .line:hover{background:var(--action-wash)}
.code .line.add:hover{background:var(--addhover)}
.askbtn{margin-left:auto;opacity:0;width:20px;height:20px;border-radius:50%;background:var(--action);color:#fff;font:800 12px/20px var(--sans);text-align:center;flex:none;text-decoration:none!important}
.code .line:hover .askbtn,.code .line:focus-within .askbtn{opacity:1}
.askans{white-space:normal!important;display:block!important;margin:6px 12px 10px;background:var(--action-wash);border-radius:14px;padding:12px 14px;font:600 14.5px/1.5 var(--sans);color:var(--ink);animation:in .35s var(--ease)}
.askq{display:flex;align-items:center;gap:6px;color:var(--action);font-family:var(--head)}
.askans p{margin:4px 0 8px}
.askmore{display:flex;gap:8px}
.askmore input{flex:1;min-width:0;border:2px solid #D6C9FF;border-radius:999px;padding:7px 14px;font:600 14px var(--sans);background:var(--field);color:var(--ink)}
.askmore input:focus{outline:none;border-color:var(--action)}

/* progress + export */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.prog{max-width:860px}
.clist{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.cchip{display:flex;align-items:center;gap:8px;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
.cchip code{font-size:13px}
.cchip small{font:700 11px var(--mono);opacity:.6}
.cchip.solid{background:var(--ok);color:var(--ok-ink)}
.cchip.weak{background:var(--unk);color:var(--unk-ink)}
.cchip.new{background:var(--ground);color:var(--ink-2)}
.exbtns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.exbox{max-width:860px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.exbox pre{margin:0;width:100%;background:var(--track);color:var(--ink);border-radius:12px;padding:14px;font:13px/1.6 var(--mono);white-space:pre-wrap}

@media (max-width:900px){
  #nav{position:static;padding:0;background:none}
  .stepper{position:fixed;left:10px;right:10px;bottom:10px;z-index:10;width:auto;justify-content:space-between;border-radius:22px;box-shadow:0 10px 30px -8px rgba(42,27,61,.35)}
  .stepchip{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;flex:1;border-radius:16px}
  .stepper .bar{display:none}
  .alert-actions,.testres{margin-left:0}
  .alert-actions .cpills{margin-left:0}
  .strip.mini .trace{margin-left:0}
  .stepnav{flex-wrap:wrap}
  .stepnav .primary{flex:1;justify-content:center}
}

:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#160F26; --ground-2:#2B2145; --card:#221A38;
  --ink:#F5F0FF; --ink-2:#CFC4E6; --ink-3:#A497BF; --line:#33294F; --line-2:#463A66;
  --action:#8E6BFF; --action-hover:#7C57FF; --action-wash:#2F2557; --on-action:#FFFFFF;
  --soch:#1C3556; --soch-ink:#B2D6FF;
  --read:#163A2A; --read-ink:#A2EBC0;
  --edit:#463712; --edit-ink:#FFDD6E;
  --run:#4A2418; --run-ink:#FFBCA1;
  --ok:#163A2A; --ok-ink:#A2EBC0;
  --unk:#463712; --unk-ink:#FFDD6E;
  --bad:#47192A; --bad-ink:#FF9AA8; --bad-solid:#FF4D63;
  --add:#123324; --add-ink:#8FE3B1; --del:#3E1824;
  --track:#1B1430; --chip:#2B2145; --fp:#241C3E; --field:#1B1430; --addhover:#18432F; --livering:#4A1D2A;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 28px -16px rgba(0,0,0,.7);
}
:root[data-theme="dark"] .mark .box{background:var(--action)}
:root[data-theme="dark"] .lesson > .card.hero{background:linear-gradient(var(--action),var(--action))}
:root[data-theme="dark"] .lesson > .card.hero h5{color:#E4DAFF}
:root[data-theme="dark"] .now .t,:root[data-theme="dark"] .now .what code{background:rgba(0,0,0,.28);color:var(--ink)}
:root[data-theme="dark"] .note{color:var(--ink)}
:root[data-theme="dark"] .tick.soch{box-shadow:inset 0 0 0 2px #3C6BA6}
:root[data-theme="dark"] .tick.read{box-shadow:inset 0 0 0 2px #2E7D55}
:root[data-theme="dark"] .tick.edit{box-shadow:inset 0 0 0 2px #B48B1A}
:root[data-theme="dark"] .tick.run{box-shadow:inset 0 0 0 2px #B05A39}
:root[data-theme="dark"] .wire .node.changed rect{stroke:#B48B1A}
:root[data-theme="dark"] .wire .node.new rect{stroke:#3FBF7A}
:root[data-theme="dark"] .wire .edge{stroke:#5A4C7E}
:root[data-theme="dark"] .bar i.t{box-shadow:inset 0 0 0 2px #B48B1A}
:root[data-theme="dark"] .fixprompt{border-color:#5B47A8}
:root[data-theme="dark"] .askmore input{border-color:#4B3D80}
:root[data-theme="dark"] .primary{box-shadow:0 4px 0 #5432D6}
:root[data-theme="dark"] .log pre,:root[data-theme="dark"] .testres pre{background:#0E0919}
:root[data-theme="dark"] #nav{background:linear-gradient(var(--ground) 82%,transparent)}
:root[data-theme="dark"] .rec i{box-shadow:0 0 0 4px var(--livering)}
.themebtn{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.themebtn:hover{color:var(--action)}
.themebtn .i{width:20px;height:20px}
.themebtn .moon{display:block}.themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .moon{display:none}:root[data-theme="dark"] .themebtn .sun{display:block}

/* ===== round 4: calmer colours, less busy ===== */
:root{
  --ground:#F5F4F8; --ground-2:#EAE8EF; --card:#FFFFFF;
  --ink:#231A33; --ink-2:#584E69; --ink-3:#7B7389; --line:#E7E4EC; --line-2:#D8D4E0;
  --action:#5A50C8; --action-hover:#4B42B3; --action-wash:#EEEDF9; --on-action:#FFFFFF;
  --soch:#E8F0FA; --soch-ink:#2F5A86;
  --read:#E7F3EC; --read-ink:#2B6646;
  --edit:#FAF3DC; --edit-ink:#735A14;
  --run:#FAECE4; --run-ink:#86452A;
  --ok:#E7F3EC; --ok-ink:#2B6646;
  --unk:#FAF3DC; --unk-ink:#735A14;
  --bad:#FBE9EB; --bad-ink:#A3293A; --bad-solid:#D14A59;
  --live:#E0525A; --add:#ECF6F0; --add-ink:#2B6646; --del:#FBEEF0;
  --track:#FAFAFC; --chip:#F1EFF5; --fp:#F8F7FD; --field:#FFFFFF; --addhover:#DFF0E6; --livering:#F8DFE1;
  --shadow:0 1px 2px rgba(35,26,51,.04);
}
:root[data-theme="dark"]{
  --ground:#14131A; --ground-2:#24222D; --card:#1C1A24;
  --ink:#EDEAF3; --ink-2:#BCB5CA; --ink-3:#8E879D; --line:#2A2733; --line-2:#383444;
  --action:#8A82E2; --action-hover:#7A71D8; --action-wash:#272442; --on-action:#FFFFFF;
  --soch:#1E2836; --soch-ink:#A8C3E3;
  --read:#1D2B25; --read-ink:#A3D3B6;
  --edit:#2F2A1C; --edit-ink:#E2CC8C;
  --run:#31241F; --run-ink:#E4B7A2;
  --ok:#1D2B25; --ok-ink:#A3D3B6;
  --unk:#2F2A1C; --unk-ink:#E2CC8C;
  --bad:#35202A; --bad-ink:#EFA4AE; --bad-solid:#DB6270;
  --live:#E0626A; --add:#1A2A22; --add-ink:#9BD1B1; --del:#33202A;
  --track:#17161E; --chip:#262330; --fp:#1F1D2A; --field:#17161E; --addhover:#203227; --livering:#3A2228;
  --shadow:none;
}
/* hairlines instead of floating shadows */
.rec,.seg,.strip,.claim,.findings .pending,.tabs,.empty,.feed,.logwrap,.code,.wire,.wire-info,.impact li,.lesson > .card,.areas li,.card,.cbar,.stepper,.exbox,.themebtn{border:1px solid var(--line);box-shadow:none}
.turn{box-shadow:none;border:1px solid var(--line)}
.turn:hover{border-color:var(--line-2)}
.turn[aria-current="true"]{border:1.5px solid var(--action);box-shadow:none}
.overviewbtn{border:1px dashed var(--line-2)}
.alert{border-width:1.5px;box-shadow:none}
.claim.bad{border:1.5px solid var(--bad-solid)}
.primary,.primary.sm,:root[data-theme="dark"] .primary{box-shadow:none}
.explain-back button{box-shadow:none}
.opts button{border-width:1.5px;border-bottom-width:1.5px}
.files button,.ghost{border-width:1.5px}
/* timeline pills softer */
.tick.soch{box-shadow:inset 0 0 0 1.5px #BFD3EA}
.tick.read{box-shadow:inset 0 0 0 1.5px #BCDCC8}
.tick.edit{box-shadow:inset 0 0 0 1.5px #E6D294}
.tick.run{box-shadow:inset 0 0 0 1.5px #E9C3B1}
:root[data-theme="dark"] .tick.soch{box-shadow:inset 0 0 0 1.5px #34465E}
:root[data-theme="dark"] .tick.read{box-shadow:inset 0 0 0 1.5px #335244}
:root[data-theme="dark"] .tick.edit{box-shadow:inset 0 0 0 1.5px #56492A}
:root[data-theme="dark"] .tick.run{box-shadow:inset 0 0 0 1.5px #5A3F33}
.chans div{margin:4px 0}
/* plain-words note: a quiet side column, not a bubble */
.note,:root[data-theme="dark"] .note{background:transparent;border-left:1px solid var(--line-2);border-radius:0;padding:6px 0 6px 18px;color:var(--ink)}
.note::before{display:none}
.note b{color:var(--action);font-size:14px}
/* "Kya hua": white card with a small colour mark */
.lesson > .card.hero,:root[data-theme="dark"] .lesson > .card.hero{background:var(--card);color:var(--ink)}
.lesson > .card.hero h5,:root[data-theme="dark"] .lesson > .card.hero h5{color:var(--action);display:flex;align-items:center;gap:8px;font-size:16px}
.lesson > .card.hero h5::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--action)}
.lesson .big{font-size:23px}
/* calmer fills */
.facts div,.facts div:nth-child(2),.facts div:nth-child(3),.facts div:nth-child(4){background:var(--card);border:1px solid var(--line)}
.facts div:nth-child(3) b{color:var(--bad-ink)}
.concepts details{background:var(--card);border:1px solid var(--line)}
.concepts details[open]{box-shadow:none;border-color:var(--line-2)}
.concepts summary{color:var(--ink)}
.now{border:1px solid var(--line)}
.now.ch-msg,.now.ch-prompt{box-shadow:none}
.chans div:nth-child(1),.chans div:nth-child(2),.chans div:nth-child(3),.chans div:nth-child(4){font-weight:700}
.meter.l1 i:nth-child(-n+1){background:#5BAA7E}
.meter.l2 i:nth-child(-n+2){background:#D9A441}
.pin.ok{background:#5BAA7E}.pin.unk{background:#D9B441}
.wire .node.changed rect{stroke:#E0C970}
.wire .node.new rect{stroke:#8CC9A5;stroke-width:2}
.wire .node.risk rect{stroke-width:2}
.wire .edge.new{stroke:#5BAA7E;stroke-width:2.5}
:root[data-theme="dark"] .wire .node.changed rect{stroke:#6E5E32}
:root[data-theme="dark"] .wire .node.new rect{stroke:#3D6B52}
:root[data-theme="dark"] .mark .box{background:var(--action)}
.mark .box{background:var(--ink)}
.mark .box i{background:#F2D46B}
.stepper .bar i{background:#5BAA7E}
.bar i.t{background:var(--edit);box-shadow:inset 0 0 0 1.5px #E0C970}
.fixprompt{border:1px dashed var(--line-2)}
.testres{border:1px solid var(--line)}
.strip{padding:16px 20px}

/* ===== round 5 ===== */
.summary{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:14px;margin-bottom:16px}
.health,.asks{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.hv{display:inline-flex;align-items:center;gap:8px;font:800 18px var(--head);padding:6px 14px 6px 10px;border-radius:999px}
.hv .i{width:18px;height:18px;stroke-width:2.6}
.h-ok .hv{background:var(--ok);color:var(--ok-ink)}
.h-check .hv{background:var(--unk);color:var(--unk-ink)}
.h-risk .hv{background:var(--bad);color:var(--bad-ink)}
.h-wip .hv{background:var(--chip);color:var(--ink-2)}
.health ul{margin:10px 0 0;padding-left:20px;color:var(--ink-2);font-weight:600;font-size:14.5px}
.health li+li{margin-top:2px}
.asks h4{margin:0 0 8px;font:800 16px var(--head)}
.asks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.asks li{display:flex;gap:10px;align-items:flex-start}
.asks .aic{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;margin-top:1px}
.asks .aic .i{width:15px;height:15px;stroke-width:2.6}
.a-done .aic{background:var(--ok);color:var(--ok-ink)}
.a-part .aic{background:var(--unk);color:var(--unk-ink)}
.a-no .aic{background:var(--bad);color:var(--bad-ink)}
.a-wip .aic{background:var(--chip);color:var(--ink-2)}
.asks b{display:block;font-size:15px}
.asks small{display:block;color:var(--ink-2);font-size:13.5px;font-weight:600;line-height:1.45}

.term{text-decoration:underline dotted var(--action);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;position:relative;outline:none}
.term:hover::after,.term:focus::after{content:attr(data-def);position:absolute;left:0;bottom:calc(100% + 8px);width:max-content;max-width:260px;background:var(--ink);color:var(--card);font:600 13px/1.45 var(--sans);padding:8px 11px;border-radius:10px;z-index:30;white-space:normal;letter-spacing:0;text-transform:none}
.term:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:3px}

.decision .dq{font-weight:700;margin-bottom:12px}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dopt{border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.dopt.pick{border:1.5px solid var(--ok-ink);background:var(--ok)}
.dopt b{display:block;font:800 16px var(--head);margin:6px 0 2px}
.dopt p{margin:0;font-size:14.5px;color:var(--ink-2)}
.dopt.pick p{color:var(--ink)}
.dtag{display:inline-flex;align-items:center;gap:4px;font:800 12px var(--sans);color:var(--ink-3)}
.dopt.pick .dtag{color:var(--ok-ink)}
.dtag .i{width:13px;height:13px;stroke-width:3}
.dquote{margin:12px 0 0!important;font-size:14px!important;color:var(--ink-2);font-style:italic}

.errline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.errline a,.errcard a{color:var(--action);font-weight:800;cursor:pointer;text-decoration:none;margin-left:auto}
.errraw{margin:0 0 12px;background:var(--ground-2);border-radius:12px;padding:10px 12px;font:12.5px/1.55 var(--mono);overflow:auto;color:var(--ink)}
.errbox{background:var(--chip);border-radius:14px;padding:12px 14px;margin-top:8px;white-space:normal}
.errbox b{display:block;font:800 13px var(--head);color:var(--action)}
.errbox p{margin:2px 0 8px;font-size:14.5px;font-weight:600}
.errbox p:last-child{margin-bottom:0}

.seccard h5{display:flex;align-items:center;gap:8px}
.pkg{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.pkgtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pkgtop code{font-weight:700;font-size:14px}
.pkgtop .stampx{margin-left:auto}
.pkg dl{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:10px 0 0}
.pkg dt{font:700 12px var(--sans);color:var(--ink-3)}
.pkg dd{margin:0;font-weight:700;font-size:14px}
.nopkg{display:flex;align-items:center;gap:8px;font-weight:700;margin:0 0 10px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.cic{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.cic .i{width:15px;height:15px;stroke-width:2.6}
.c-ok .cic{background:var(--ok);color:var(--ok-ink)}
.c-warn .cic{background:var(--unk);color:var(--unk-ink)}
.checks b{font-size:15px}
.checks p{margin:2px 0 4px;font-size:14px;color:var(--ink-2)}
.checks .where{font-size:12.5px;background:var(--chip);padding:2px 8px;border-radius:6px}

.todo .todohead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tcount{font:800 14px var(--head);color:var(--ink-2)}
.tbar{display:block;height:6px;border-radius:6px;background:var(--chip);margin:4px 0 12px;overflow:hidden}
.tbar i{display:block;height:100%;background:#5BAA7E;border-radius:6px;transition:width .5s var(--spring)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tlist li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.tlist li:first-child{border-top:0}
.tlist li.none{color:var(--ink-2);font-weight:600}
.tcheck{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer;margin-top:1px;padding:0;color:#fff}
.tcheck:hover{border-color:var(--action)}
.tcheck[aria-pressed="true"]{background:#5BAA7E;border-color:#5BAA7E}
.tcheck .i{width:15px;height:15px;stroke-width:3}
.tlist b{font-size:15.5px}
.tlist p{margin:2px 0 8px;font-size:14px;color:var(--ink-2)}
.tlist li.on b{text-decoration:line-through;color:var(--ink-3)}
.tlist li.on p{display:none}
.manual ol{margin:0 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:600}
.manual code{background:var(--chip);padding:1px 6px;border-radius:6px}
.expect{background:var(--ok);border-radius:14px;padding:12px 14px}
.expect b{font:800 14px var(--head);color:var(--ok-ink)}
.expect p{margin:2px 0 0;font-weight:600;font-size:14.5px}
.lesson + .card,.todo + .manual,.panel > .card + .card{margin-top:14px}
.seccard{margin-top:14px}

/* chat */
.chatfab{position:fixed;right:22px;bottom:22px;z-index:20;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--card);padding:12px 18px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px -10px rgba(20,15,30,.45)}
.chatfab .i{width:18px;height:18px}
.chatpanel{position:fixed;right:22px;bottom:22px;z-index:21;width:min(380px,calc(100vw - 24px));max-height:min(560px,calc(100vh - 40px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 20px 50px -20px rgba(20,15,30,.5);overflow:hidden;animation:in .3s var(--ease)}
.chatpanel[hidden],.chatfab[hidden]{display:none}
.chathead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--head);font-size:16px}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--chip);color:var(--ink)}
.chatlog{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.chatlog .muted{margin:0;font-size:14px;font-weight:600}
.msg{max-width:88%;padding:9px 13px;border-radius:16px;font-size:14.5px;font-weight:600;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--action);color:var(--on-action);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--chip);color:var(--ink);border-bottom-left-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chip{border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--action);color:var(--action)}
.chatform{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.chatform input{flex:1;min-width:0;border:1.5px solid var(--line-2);border-radius:999px;padding:8px 14px;font:600 14px var(--sans);background:var(--field);color:var(--ink)}
.chatform input:focus{outline:none;border-color:var(--action)}

@media (max-width:900px){
  .summary{grid-template-columns:1fr}
  .dopts{grid-template-columns:1fr}
  .pkg dl{grid-template-columns:1fr 1fr}
  .chatfab{bottom:96px;right:14px;padding:11px 14px}
  .chatfab span{display:none}
  .chatpanel{right:12px;bottom:92px}
}

.card > h5,.todohead h5{font:800 20px var(--head);margin:0 0 10px;color:var(--ink)}
.todohead h5{margin:0}
.seccard > h5{display:flex;align-items:center;gap:8px}
.seccard > h5 .i{width:20px;height:20px;color:var(--action)}

/* ===== round 6: playground ===== */
.pgwrap{display:flex;flex-direction:column;gap:14px}
.sandbox{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ok-ink);background:var(--ok);padding:4px 10px;border-radius:999px}
.sandbox .i{width:15px;height:15px}
.sandbox.big{align-self:flex-start;font-size:14px;padding:6px 14px;margin:0}
.pg .muted{margin:-4px 0 12px}
.pgbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pgbar label{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.pgbar select{font:600 14px var(--mono);border:1.5px solid var(--line-2);border-radius:10px;padding:6px 10px;background:var(--field);color:var(--ink)}
.pgbar .sandbox{display:none}
.editor{width:100%;min-height:200px;font:13.5px/1.7 var(--mono);color:var(--ink);background:var(--track);border:1.5px solid var(--line-2);border-radius:14px;padding:12px 14px;resize:vertical;tab-size:2;white-space:pre;overflow:auto}
.editor:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px var(--action-wash)}
.pgactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pgres{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;animation:in .4s var(--ease)}
.raay p{margin:8px 0 0;font-size:15.5px;font-weight:600}
.stampx.chipc{background:var(--chip);color:var(--ink-2)}
.pgchecks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pgchecks > div{border-radius:12px;padding:10px 12px}
.pgchecks .okc{background:var(--ok)}.pgchecks .badc{background:var(--bad)}
.pgchecks b{font:800 13px var(--head)}
.pgchecks .okc b{color:var(--ok-ink)}.pgchecks .badc b{color:var(--bad-ink)}
.pgchecks pre,.predres pre{margin:4px 0 0;font:12.5px/1.5 var(--mono);white-space:pre-wrap;color:var(--ink)}
.pgimp{margin:12px 0 0;font-size:14.5px}
.cmp{margin-top:12px}
.cmp > b{font:800 14px var(--head)}
.cmpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:6px}
.cmpgrid small{font-weight:800;color:var(--ink-3)}
.code.mini{overflow-x:auto;box-shadow:none;border:1px solid var(--line);padding:8px 0;font-size:12.5px;margin-top:4px}
.code.mini div{padding:0 10px;gap:8px}
.confirm{font-weight:800;color:var(--bad-ink)}
.note2{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--ink-2)}
.pred{padding:12px 0;border-top:1px dashed var(--line)}
.pred:first-of-type{border-top:0}
.pq{font:800 17px/1.35 var(--head);margin:0 0 10px}
.opts button.picked{border-color:var(--action);background:var(--action-wash);color:var(--action)}
.pred > .primary{margin-top:10px}
.predres{margin-top:10px;border-radius:14px;padding:12px 14px;animation:in .4s var(--ease)}
.predres.good{background:var(--ok)}.predres.meh{background:var(--unk)}
.predres > b{font:800 15px var(--head)}
.predres.good > b{color:var(--ok-ink)}.predres.meh > b{color:var(--unk-ink)}
.predres p{margin:8px 0 0;font-size:14.5px;font-weight:600}
.challenge .task{font-weight:700;margin:0 0 10px}
.hints{margin:10px 0 0;padding-left:20px;font-size:14.5px;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.pvtabs{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.pvtabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink-2)}
.pvtabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.browser{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;max-width:560px}
.bbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--chip);border-bottom:1px solid var(--line)}
.bbar i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.bbar span{margin-left:10px;font:600 12px var(--mono);color:var(--ink-2);background:var(--card);padding:3px 10px;border-radius:999px;flex:1}
.bbody{background:#FFFFFF;color:#1F2430;padding:26px 24px;min-height:250px;font-family:system-ui,sans-serif}
.mock{max-width:300px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.mock h6{margin:0 0 4px;font:700 20px system-ui,sans-serif;color:#1F2430}
.mock label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#4A5160}
.mock input{border:1px solid #CBD0DA;border-radius:6px;padding:8px 10px;font:14px system-ui,sans-serif;color:#1F2430;background:#fff}
.mbtn{background:#2D6CDF;color:#fff;border:0;border-radius:6px;padding:9px;font:600 14px system-ui,sans-serif;cursor:pointer}
.mbtn:disabled{opacity:.6;cursor:default}
.mlink{color:#2D6CDF;font-size:14px;cursor:pointer;text-decoration:underline;align-self:flex-start}
.mnote{margin:0;font-size:13px;color:#8A90A0}
.mok{margin:0;color:#1E7A46;font-size:14px;font-weight:600}
.merr{margin:0;color:#C0303F;font-size:14px;font-weight:600}
.mbug{margin:0;font-size:13px;color:#8A5A00;background:#FFF4D6;border-radius:6px;padding:8px 10px}
.mhint{margin:6px 0 0;font-size:12px;color:#8A90A0}
.pvempty{color:#6A7080;font-size:14px;text-align:center;padding:60px 10px}
.pgbtn{margin-top:10px}
@media (max-width:900px){
  .pgchecks,.cmpgrid{grid-template-columns:1fr}
  .bbody{padding:18px 14px}
}
</style>
</head>
<body>

<header class="top">
  <div class="mark"><span class="box" aria-hidden="true"><i></i></span>vibe-explainer</div>
  <div class="proj"><b>notes-app</b> · <span data-i="sessionName"></span></div>
  <span class="demo" data-i="demoLabel"></span>
  <div class="spacer"></div>
  <div class="rec" id="rec" aria-live="polite"><i></i><span id="recText">REC</span></div>
  <button class="themebtn" id="themeBtn" aria-label="Dark / light"><svg class="i moon"><use href="#i-moon"/></svg><svg class="i sun"><use href="#i-sun"/></svg></button>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="hi" aria-pressed="true">Hinglish</button><button data-lang="en" aria-pressed="false">English</button>
  </div>
  <div class="seg" role="group" aria-label="Level">
    <button data-level="beg" aria-pressed="true" data-i="beginner"></button><button data-level="dev" aria-pressed="false">Developer</button>
  </div>
</header>

<div class="body">
  <nav class="rail" aria-label="Turns">
    <h3 data-i="turnsHead"></h3>
    <div id="turns"></div>
    <button class="overviewbtn" id="ovBtn" data-i="overview"></button>
  </nav>
  <main class="report" id="report">
    <div id="head"></div>
    <section class="strip mini" id="strip" aria-label="Timeline">
      <h2 id="stripTitle"></h2>
      <div class="chans" aria-hidden="true">
        <div><svg class="i"><use href="#i-soch"/></svg><span data-i="chSoch"></span></div>
        <div><svg class="i"><use href="#i-read"/></svg><span data-i="chRead"></span></div>
        <div><svg class="i"><use href="#i-edit"/></svg><span data-i="chEdit"></span></div>
        <div><svg class="i"><use href="#i-run"/></svg><span data-i="chRun"></span></div>
      </div>
      <div class="trace" id="trace" role="slider" tabindex="0" aria-valuemin="0"></div>
      <div class="scale num" id="scale"></div>
    </section>
    <div id="nav"></div>
    <div id="content"></div>
  </main>
</div>

<button class="chatfab" id="chatFab"><svg class="i"><use href="#i-chat"/></svg><span></span></button>
<section class="chatpanel" id="chatPanel" hidden aria-label="Chat"></section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-soch" viewBox="0 0 16 16"><path d="M4.5 11.5h-.2A2.8 2.8 0 0 1 4 6a3.6 3.6 0 0 1 7-.6 2.6 2.6 0 0 1 .8 5.1H7.5L5 13.5z"/></symbol>
  <symbol id="i-read" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></symbol>

  <symbol id="t-live" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M4.2 11.8a5.4 5.4 0 0 1 0-7.6M11.8 4.2a5.4 5.4 0 0 1 0 7.6"/></symbol>
  <symbol id="t-logs" viewBox="0 0 16 16"><path d="M5 4h8M5 8h8M5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></symbol>
  <symbol id="t-changes" viewBox="0 0 16 16"><path d="M2.5 5h5M5 2.5v5M8.5 11.5h5"/><path d="M12 3L4 13" opacity=".5"/></symbol>
  <symbol id="t-wiring" viewBox="0 0 16 16"><circle cx="3.5" cy="4" r="1.8"/><circle cx="3.5" cy="12" r="1.8"/><circle cx="12.5" cy="8" r="1.8"/><path d="M5.2 4.6l5.6 2.6M5.2 11.4l5.6-2.6"/></symbol>
  <symbol id="t-impact" viewBox="0 0 16 16"><path d="M8 2l6 11H2z"/><path d="M8 6.5v3M8 11.5h.01"/></symbol>
  <symbol id="t-seekho" viewBox="0 0 16 16"><path d="M1.5 6L8 3l6.5 3L8 9z"/><path d="M4 7.3v3.4c1 1 2.4 1.5 4 1.5s3-.5 4-1.5V7.3"/></symbol>
  <symbol id="i-ok" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></symbol>

function strip(){

  tr.style.setProperty("--minor", (w/dur<10 ? w/dur*10 : w/dur)+"px"); tr.style.setProperty("--major",(w/dur*10)+"px");
  const row = {soch:0,read:1,edit:2,run:3,msg:0,prompt:0};
  let h = "";
  x.events.forEach((e,i)=>{
    const next = x.events[i+1]; const len = next ? Math.max(.6,(next.t-e.t)*.8) : .8;
    const cls = e.ch==="msg"||e.ch==="prompt" ? "soch" : e.ch;
    const left = e.t/dur*100, width = len/dur*100;
    h += `<span class="tick ${cls} ${e.bad||e.result==="fail"?"bad":""} ${e.t<=S.cur?"past":"future"}" style="left:${left}%;width:${width}%;top:${row[e.ch]*32}px" title="${fmt(e.t)} ${esc(T(e.text))}"></span>`;

function wiring(x){
  if(!x.wiring) return `<div class="empty">${S.lang==="hi"?"Naksha turn khatam hone pe banega.":"The map is drawn when the turn ends."}</div>`;
  const W = x.wiring, nw=200, nh=50;
  const pos = Object.fromEntries(W.nodes.map(n=>[n.id,n]));
  const maxX = Math.max(...W.nodes.map(n=>n.x))+nw+30, maxY = Math.max(...W.nodes.map(n=>n.y))+nh+30;
  const linked = id => !S.wireSel || id===S.wireSel || W.edges.some(([a,b])=>(a===S.wireSel&&b===id)||(b===S.wireSel&&a===id));
  const edges = W.edges.map(([a,b,k])=>{ const A=pos[a],B=pos[b];
    let x1=A.x+nw,y1=A.y+nh/2,x2=B.x,y2=B.y+nh/2;
    if(B.x===A.x){ x1=A.x+nw/2; y1=A.y+nh; x2=B.x+nw/2; y2=B.y; }
    const d = B.x===A.x ? `M${x1},${y1} L${x2},${y2-4}` : `M${x1},${y1} C${x1+50},${y1} ${x2-50},${y2} ${x2-4},${y2}`;
    const dim = S.wireSel && !(a===S.wireSel||b===S.wireSel);
    return `<path class="edge ${k||""} ${dim?"dim":""}" d="${d}" marker-end="url(#${k==="new"?"arN":"ar"})"/>`; }).join("");
  const nodes = W.nodes.map(n=>`<g class="node ${n.st} ${linked(n.id)?"":"dim"}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)}">
     <rect x="${n.x}" y="${n.y}" width="${nw}" height="${nh}" rx="12"/>
     <text x="${n.x+14}" y="${n.y+22}">${esc(n.label)}</text><text class="k" x="${n.x+14}" y="${n.y+39}">${esc(n.k)}</text></g>`).join("");
  return `<div class="wire"><svg viewBox="0 0 ${maxX} ${maxY}" role="img" aria-label="Wiring">
     <defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="${document.documentElement.dataset.theme==="dark"?"#5A4C7E":"#C9B8AA"}"/></marker>
     <marker id="arN" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#5BAA7E"/></marker></defs>
     ${edges}${nodes}</svg></div>
   <div class="legend"><span><i></i>${T(UI.legendOld)}</span><span><i class="n"></i>${T(UI.legendNew)}</span><span><i class="r"></i>${T(UI.legendRisk)}</span></div>
   <p class="wire-info">${S.wireSel?`<b><code>${esc(pos[S.wireSel].label)}</code></b> · ${esc(T(W.info[S.wireSel]))}`:`<span class="muted">${T(UI.wireHint)}</span>`}</p>`;
}

function conceptStatus(){
  const out = [];
  TURNS.forEach(t=>{ if(!t.lesson) return; const qs = S.quiz[t.id]||{}; const answered = Object.keys(qs).length;
    const right = Object.entries(qs).filter(([i,v])=>t.lesson.quiz[i].a===v).length;
    const st = answered===0 ? "new" : (right===t.lesson.quiz.length && answered===t.lesson.quiz.length ? "solid" : "weak");
    t.lesson.concepts.forEach(c=>out.push({n:c.n, d:c.d, st, turn:t.id})); });
  if(S.pg && S.pg.ch.solved) out.push({n:"try/catch", st:"solid", turn:3});
  return out;
}

const GLOSS_RE = new RegExp("(^|[^A-Za-z/])(" + Object.keys(GLOSS).map(k=>k.replace("/","\\/")).join("|") + ")(?![A-Za-z])","gi");
function gl(txt){
  const s = esc(txt); const seen = new Set();
  return s.replace(GLOSS_RE, (m,pre,w)=>{ const key = Object.keys(GLOSS).find(k=>k.toLowerCase()===w.toLowerCase()); if(seen.has(key)) return m; seen.add(key); return `${pre}<span class="term" tabindex="0" data-def="${esc(T(GLOSS[key]))}">${w}</span>`; });
}

function health(x){
  if(x.live) return {k:"wip",why:[{hi:"Turn khatam hone pe faisla aayega",en:"The verdict comes when the turn ends"}]};
  const why = []; let k = "ok";
  const ranTests = x.events.some(e=>e.ch==="run" && /test/.test(e.target||""));
  const bad = x.claims.filter(c=>c.s==="bad").length;
  const risky = x.impact.filter(i=>i.r>=2).length;
  const sec = ((SEC[x.id]||{}).checks||[]).filter(c=>c.s==="warn").length;
  if(S.tests[x.id]==="done"){ why.push({hi:"Tests chale: 1 fail hua",en:"Tests ran: 1 failed"}); k="check"; }
  else if(!ranTests && x.files.length){ why.push({hi:"Is turn mein koi test nahi chala",en:"No test ran in this turn"}); k="check"; }
  else if(ranTests) why.push({hi:"Tests chale aur pass hue",en:"Tests ran and passed"});
  if(bad){ why.push({hi:`${bad} daawa bina saboot`,en:`${bad} claim without evidence`}); k="check"; }
  if(risky){ why.push({hi:`${risky} jagah risk (Beech ya zyada)`,en:`${risky} medium-or-higher risk${risky>1?"s":""}`}); k="check"; }
  if(sec){ why.push({hi:`${sec} security baat dhyan dene layak`,en:`${sec} security note`}); }
  if(x.impact.some(i=>i.r>=3)) k="risk";
  if(k==="ok" && !why.length) why.push({hi:"Koi risk ya adhoora daawa nahi",en:"No risks or open claims"});
  return {k,why};
}

function pgHunks(x){ const out=[]; x.files.forEach((f,fi)=>f.hunks.forEach((h,hi)=>out.push({key:`${fi}:${hi}`, label:`${f.path.split("/").pop()} · ${S.lang==="hi"?"hissa":"part"} ${hi+1}`, orig:h.lines.filter(([s])=>s!=="-").map(([,t])=>t).join("\n").replace(/^\n+/,"")}))); return out; }
function lineDiff(a,b){
  const A=a.split("\n"), B=b.split("\n"), n=A.length, m=B.length, L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){ out.push([" ",A[i]]); i++; j++; } else if(L[i+1][j]>=L[i][j+1]){ out.push(["-",A[i++]]); } else { out.push(["+",B[j++]]); } }
  while(i<n) out.push(["-",A[i++]]); while(j<m) out.push(["+",B[j++]]); return out;
}
function pgAnalyze(orig, ed){
