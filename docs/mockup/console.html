  const H = (hi,en)=>({hi,en});
  if(ed.trim()===orig.trim()) return {v:"same",raay:H("Tumne abhi kuch nahi badla. Koi line badlo, jaise `await` hata do ya message ka text.","You haven't changed anything yet. Try removing an `await` or editing the message text."),lint:[true,"✔ 0 problems"],tests:[true,"Tests  6 passed (6)"]};
  if(cnt(ed,"{")!==cnt(ed,"}")||cnt(ed,"(")!==cnt(ed,")")) return {v:"bad",raay:H("Brackets ka jodaa toot gaya: koi `{` ya `(` khula hai jo band nahi hua. Isliye code chalega hi nahi. Har kholne wale bracket ka band hona zaroori hai.","The brackets don't pair up: a `{` or `(` was opened and never closed, so the code won't even run."),lint:[false,"error  Parsing error: Unexpected token\n✖ 1 problem (1 error)"],tests:[false,"Test suite failed to run: SyntaxError"],imp:H("Poori file load nahi hogi, isliye login aur reset dono band.","The whole file fails to load, so login and reset both stop working.")};
  if(/await\s+http\.post/.test(orig) && !/await\s+http\.post/.test(ed)) return {v:"bad",raay:H("`await` hatane se `res` ab server ka jawab nahi, balki ek Promise (aane wala jawab) hai. `res.ok` hamesha undefined hoga, isliye `!res.ok` hamesha sach, aur har baar error phenka jaayega, chahe server ne theek jawab diya ho.","Without `await`, `res` is a Promise, not the reply. `res.ok` is always undefined, so `!res.ok` is always true and an error is thrown every time, even when the server said OK."),lint:[true,"✔ 0 problems"],tests:[false,"✗ requestPasswordReset > returns true when server says ok\n  Expected: true\n  Received: AuthError\nTests  1 failed | 5 passed (6)"],imp:H("Reset kabhi kaam nahi karega. ResetPassword.jsx aur uska test dono affect.","Reset never works. ResetPassword.jsx and its test are affected.")};
  if(/try\s*\{/.test(ed) && /catch/.test(ed) && !/try\s*\{/.test(orig)) return {v:"good",raay:H("Badhiya! `try/catch` lagane se reset fail hone pe error pakda jaata hai aur user ko message dikh sakta hai. Yahi Impact ka doosra risk tha.","Nice! With `try/catch` a failed reset is caught and the user can see a message. That was the second risk on Impact."),lint:[true,"✔ 0 problems"],tests:[true,"✓ ResetPassword > shows an error when reset fails\nTests  6 passed (6)"],imp:H("Sirf ResetPassword.jsx. Baaki sab waisa hi.","Only ResetPassword.jsx. Nothing else changes.")};
  if(/return true;/.test(orig) && !/return true;/.test(ed)) return {v:"warn",raay:H("Ab function kuch return nahi karta (undefined). Abhi ResetPassword iska jawab use nahi karta, isliye kuch nahi tootega, par aage koi `if (await requestPasswordReset())` likhega to wo kabhi sach nahi hoga.","The function now returns undefined. ResetPassword doesn't use the value yet, so nothing breaks today, but a future `if (await requestPasswordReset())` would never be true."),lint:[true,"✔ 0 problems"],tests:[false,"✗ requestPasswordReset > returns true when server says ok\n  Expected: true  Received: undefined\nTests  1 failed | 5 passed (6)"],imp:H("Abhi koi screen nahi badli, par ek test fail.","No screen changes yet, but one test fails.")};
  if(/Reset link nahi bhej paaye/.test(orig) && !/Reset link nahi bhej paaye/.test(ed)) return {v:"good",raay:H("Sirf error ka text badla. Kaam waisa hi hai, bas user ko naya message dikhega. Aise chhote badlaav safe hote hain.","Only the error text changed. Behaviour is the same; the user just sees your new message. Small changes like this are safe."),lint:[true,"✔ 0 problems"],tests:[true,"Tests  6 passed (6)"],imp:H("Sirf woh message jo reset fail hone pe dikhta hai.","Only the message shown when a reset fails.")};
  return {v:"good",raay:H("Sandbox mein code chal gaya aur kuch nahi toota. Asli tool mein teacher tumhare exact badlaav ko line-by-line samjhayega.","The code ran in the sandbox and nothing broke. In the real tool the teacher explains your exact change line by line."),lint:[true,"✔ 0 problems"],tests:[true,"Tests  6 passed (6)"]};
}
const PRED = {3:[
  {q:{hi:"Agar `requestPasswordReset` mein `await` hata do, to sahi email daalne pe kya hoga?",en:"If you remove `await` in `requestPasswordReset`, what happens with a valid email?"},
   o:[{hi:"'Link bhej diya' aayega, sab theek",en:"'Link sent' shows, all fine"},{hi:"Har baar error phenkega, chahe server ne OK bola ho",en:"It throws an error every time, even when the server said OK"},{hi:"App crash ho jaayegi",en:"The app crashes"}],a:1,
   out:"✗ requestPasswordReset > returns true when server says ok\n  Received: AuthError (status undefined)\nTests  1 failed | 5 passed (6)",
   e:{hi:"Bina `await` ke `res` ek Promise hai. Promise pe `.ok` nahi hota, isliye condition hamesha error wali taraf jaati hai.",en:"Without `await`, `res` is a Promise. A Promise has no `.ok`, so the check always goes the error way."}},
  {q:{hi:"Agar App.jsx se `/reset` wala route hata do, to 'Forgot password?' dabane pe kya hoga?",en:"If you remove the `/reset` route from App.jsx, what happens when you click 'Forgot password?'"},
   o:[{hi:"Reset page phir bhi khulega",en:"The reset page still opens"},{hi:"Khaali page ya 'Not found' aayega",en:"A blank or 'Not found' page"},{hi:"Login page reload hoga",en:"The login page reloads"}],a:1,
   out:"GET /reset → no route matched\n<Routes> rendered nothing (blank page)",
   e:{hi:"Link `/reset` pe le jaata hai, par App ko pata hi nahi ki wahan kya dikhana hai. Route hi address ko page se jodta hai.",en:"The link goes to `/reset`, but the app no longer knows what to show there. The route is what ties an address to a page."}},
]};
const CHALLENGE = {3:{
  task:{hi:"ResetPassword.jsx ke `onSubmit` mein `try/catch` lagao. Reset fail ho to `setError(...)` se user ko message dikhao.",en:"Add `try/catch` to `onSubmit` in ResetPassword.jsx. If the reset fails, show the user a message with `setError(...)`."},
  starter:"async function onSubmit(e) {\n  e.preventDefault();\n  await requestPasswordReset(email);\n  setSent(true);\n}",
  solution:"async function onSubmit(e) {\n  e.preventDefault();\n  setError(null);\n  try {\n    await requestPasswordReset(email);\n    setSent(true);\n  } catch (err) {\n    setError('Reset link nahi bhej paaye. Email check karo.');\n  }\n}",
  hints:[{hi:"Jo line fail ho sakti hai (`await requestPasswordReset`) usse `try { ... }` ke andar rakho.",en:"Put the line that can fail (`await requestPasswordReset`) inside `try { ... }`."},
         {hi:"`try` ke baad `catch (err) { ... }` likho. Error aane pe wahi chalega.",en:"After `try`, write `catch (err) { ... }`. That runs when an error happens."},
         {hi:"`catch` ke andar `setError('...')` likho taaki screen pe message aaye.",en:"Inside `catch`, call `setError('...')` so a message appears on screen."}]}};
function chCheck(code){
  const H=(hi,en)=>({hi,en});
  if(!/try\s*\{/.test(code)) return {ok:false,m:H("Abhi koi `try` block nahi hai. Test 'shows an error when reset fails' fail hua: reset fail hone pe screen pe kuch nahi aaya.","There's no `try` block yet. The test 'shows an error when reset fails' failed: nothing appeared when the reset failed."),out:"✗ ResetPassword > shows an error when reset fails\n  Unable to find text: /nahi bhej paaye/"};
  if(!/catch\s*\(/.test(code)) return {ok:false,m:H("`try` hai par `catch` nahi. Bina `catch` ke `try` adhoora hai, isliye code chalega hi nahi.","There's a `try` but no `catch`. A `try` without `catch` is incomplete, so the code won't run."),out:"error  Parsing error: Missing catch or finally after try"};
  if(!/setError\s*\(/.test(code)) return {ok:false,m:H("Error pakad liya, shabaash! Par user ko abhi bhi kuch nahi dikhta. `catch` ke andar `setError(...)` lagao.","You catch the error, good! But the user still sees nothing. Call `setError(...)` inside `catch`."),out:"✗ ResetPassword > shows an error when reset fails\n  Unable to find text: /nahi bhej paaye/"};
  return {ok:true,out:"✓ ResetPassword > sends the reset request\n✓ ResetPassword > shows 'link sent' on success\n✓ ResetPassword > shows an error when reset fails\nTests  3 passed (3)"};
}

function pgRun(){
  const x = turn(); const hs = pgHunks(x); const h = hs.find(k=>k.key===S.pg.hunk)||hs[0]; if(!h) return;
  const ed = S.pg.code[h.key] ?? h.orig;
  S.pg.running = true; S.pg.run = null; S.pg.act = null; report();
  setTimeout(()=>{ S.pg.running=false; S.pg.run = {key:h.key, ...pgAnalyze(h.orig, ed), diff:lineDiff(h.orig, ed)}; report(); }, 1300);
}
function pgCodeBlock(lines){ return lines.map(([s,t])=>`<div class="${s==="+"?"add":s==="-"?"del":""}"><span class="sg">${s==="+"?"+":s==="-"?"−":" "}</span><span>${esc(t)||" "}</span></div>`).join(""); }
const mdc = s => String(s).split("`").map((p,i)=> i%2 ? `<code>${esc(p)}</code>` : esc(p)).join("");

function playground(x){
  if(x.live || !x.lesson) return `<div class="empty">${S.lang==="hi"?"Playground turn khatam hone pe khulega.":"The playground opens when the turn ends."}</div>`;
  const hs = pgHunks(x); if(!S.pg.hunk || !hs.find(k=>k.key===S.pg.hunk)) S.pg.hunk = (hs.find(k=>/return true/.test(k.orig))||hs[0]).key;
  const h = hs.find(k=>k.key===S.pg.hunk); const ed = S.pg.code[h.key] ?? h.orig; const r = S.pg.run && S.pg.run.key===h.key ? S.pg.run : null;
  const vk = {good:["ok","i-ok"],warn:["unk","t-impact"],bad:["bad","i-bad"],same:["chipc","i-unk"]};
  /* A */
  let A = `<section class="card pg"><h5>${T(UI4.aHead)}</h5><p class="muted">${T(UI4.aLede)}</p>
    <div class="pgbar"><label>${T(UI4.pick)} <select id="pgPick">${hs.map(k=>`<option value="${k.key}" ${k.key===h.key?"selected":""}>${esc(k.label)}</option>`).join("")}</select></label>
      <span class="sandbox"><svg class="i"><use href="#i-shield"/></svg>${T(UI4.safe)}</span></div>
    <textarea class="editor" id="pgCode" spellcheck="false" aria-label="Code">${esc(ed)}</textarea>
    <div class="pgactions"><button class="primary sm" id="pgRun" ${S.pg.running?"disabled":""}>${S.pg.running?`<span class="spin"></span>${T(UI4.running)}`:`<svg class="i"><use href="#i-run"/></svg>${T(UI4.run)}`}</button>
      <button class="ghost sm" id="pgReset">${T(UI4.reset)}</button></div>`;
  if(r){
    A += `<div class="pgres v-${r.v}"><div class="raay"><span class="stampx ${vk[r.v][0]}"><svg class="i"><use href="#${vk[r.v][1]}"/></svg>${T(UI4.raay)}</span><p>${mdc(T(r.raay))}</p></div>
      <div class="pgchecks"><div class="${r.lint[0]?"okc":"badc"}"><b>${T(UI4.lint)}</b><pre>${esc(r.lint[1])}</pre></div><div class="${r.tests[0]?"okc":"badc"}"><b>${T(UI4.tests)}</b><pre>${esc(r.tests[1])}</pre></div></div>
      ${r.imp?`<p class="pgimp"><b>${T(UI4.imp)}:</b> ${esc(T(r.imp))}</p>`:""}
      ${r.v!=="same"?`<div class="cmp"><b>${T(UI4.cmp)}</b><div class="cmpgrid"><div><small>${T(UI4.aiv)}</small><div class="code mini">${pgCodeBlock(r.diff.filter(([s])=>s!=="+"))}</div></div><div><small>${T(UI4.mine)}</small><div class="code mini">${pgCodeBlock(r.diff.filter(([s])=>s!=="-"))}</div></div></div></div>
      <div class="pgactions">${S.pg.act==="confirm"?`<span class="confirm">${T(UI4.applyConfirm)}</span><button class="primary sm" id="pgApplyYes">${T(UI4.yes)}</button><button class="ghost sm" id="pgApplyNo">${T(UI4.no)}</button>`
        :`<button class="primary sm" id="pgApply"><svg class="i"><use href="#i-ok"/></svg>${T(UI4.apply)}</button><button class="ghost sm" data-copy="pgprompt">${S.copied==="pgprompt"?`<svg class="i"><use href="#i-ok"/></svg>${T(UI2.copied)}`:`<svg class="i"><use href="#i-copy"/></svg>${T(UI4.toPrompt)}`}</button><button class="ghost sm" id="pgDiscard">${T(UI4.discard)}</button>`}</div>
      ${S.pg.act==="applied"?`<p class="note2">${T(UI4.applied)}</p>`:S.pg.act==="discarded"?`<p class="note2">${T(UI4.discarded)}</p>`:""}`:""}
    </div>`;
  }
  A += `</section>`;
  /* B */
  const P = PRED[x.id]||[];
  const B = P.length?`<section class="card pg"><h5>${T(UI4.bHead)}</h5><p class="muted">${T(UI4.bLede)}</p>${P.map((p,i)=>{ const pick=S.pg.pred[i], ran=S.pg.predRun[i];
    return `<div class="pred"><p class="pq">${mdc(T(p.q))}</p><div class="opts">${p.o.map((o,j)=>{ const cls = ran ? (j===p.a?"right":(j===pick?"wrong":"")) : (j===pick?"picked":""); return `<button data-pred="${i}:${j}" class="${cls}" ${ran?"disabled":""}>${esc(T(o))}</button>`; }).join("")}</div>
      ${!ran?`<button class="primary sm" data-predrun="${i}" ${pick==null?"disabled":""}><svg class="i"><use href="#i-run"/></svg>${T(UI4.check)}</button>`
        :`<div class="predres ${pick===p.a?"good":"meh"}"><b>${pick===p.a?T(UI4.right):T(UI4.wrong)}</b><pre>${esc(p.out)}</pre><p>${mdc(T(p.e))}</p></div>`}</div>`; }).join("")}</section>`:"";
  /* C */
  const C0 = CHALLENGE[x.id]; let C = "";
  if(C0){ const ch=S.pg.ch; if(ch.code==null) ch.code=C0.starter;
    C = `<section class="card pg challenge"><h5>${T(UI4.cHead)}</h5><p class="task">${mdc(T(C0.task))}</p>
      <textarea class="editor" id="chCode" spellcheck="false" aria-label="Challenge code">${esc(ch.showSol?C0.solution:ch.code)}</textarea>
      <div class="pgactions"><button class="primary sm" id="chCheck"><svg class="i"><use href="#i-ok"/></svg>${T(UI4.cCheck)}</button>
        ${ch.hints<C0.hints.length?`<button class="ghost sm" id="chHint"><svg class="i"><use href="#i-unk"/></svg>${T(UI4.cHint)} (${ch.hints}/${C0.hints.length})</button>`:`<button class="ghost sm" id="chSol">${T(UI4.cSol)}</button>`}</div>
      ${ch.hints?`<ol class="hints">${C0.hints.slice(0,ch.hints).map(hh=>`<li>${mdc(T(hh))}</li>`).join("")}</ol>`:""}
      ${ch.res?`<div class="predres ${ch.res.ok?"good":"meh"}"><b>${ch.res.ok?T(UI4.cPass):(S.lang==="hi"?"Abhi nahi":"Not yet")}</b>${ch.res.ok?"":`<p>${mdc(T(ch.res.m))}</p>`}<pre>${esc(ch.res.out)}</pre></div>`:""}
    </section>`; }
  /* D */
  const D = x.id===3 ? previewCard() : "";
  return `<div class="pgwrap"><p class="sandbox big"><svg class="i"><use href="#i-shield"/></svg>${T(UI4.safe)}</p>${A}${B}${C}${D}</div>`;
}

function previewCard(){
  const v = S.pg.view, mineReady = S.pg.ch.solved;
  const tabs = [["before",UI4.vBefore],["after",UI4.vAfter],["mine",UI4.vMine]];
  const url = S.pg.screen==="login"?"/login":"/reset";
  let screen;
  if(v==="mine" && !mineReady) screen = `<div class="pvempty">${S.lang==="hi"?"Pehle upar ka 'Ab tum karo' challenge poora karo. Phir yahan tumhara version chalega.":"Finish the 'Your turn' challenge above first. Then your version runs here."}</div>`;
  else if(S.pg.screen==="login" || v==="before") screen = `<div class="mock"><h6>notes-app</h6><label>Email<input disabled value="ankit@example.com"></label><label>Password<input disabled type="password" value="secret"></label><button class="mbtn" disabled>Login</button>${v!=="before"?`<a class="mlink" data-pv="reset">Forgot password?</a>`:`<p class="mnote">${S.lang==="hi"?"Password bhoole? Koi raasta nahi.":"Forgot your password? No way back in."}</p>`}</div>`;
  else {
    const st = S.pg.pvState;
    screen = `<div class="mock"><h6>${S.lang==="hi"?"Password reset":"Reset password"}</h6>
      <label>Email<input id="pvEmail" placeholder="tum@example.com" value=""></label>
      <button class="mbtn" id="pvSend" ${st==="stuck"?"disabled":""}>${st==="stuck"?(S.lang==="hi"?"Bhej rahe hain…":"Sending…"):(S.lang==="hi"?"Reset link bhejo":"Send reset link")}</button>
      ${st==="sent"?`<p class="mok">${S.lang==="hi"?"Link bhej diya! Email check karo.":"Link sent! Check your email."}</p>`:""}
      ${st==="err"?`<p class="merr">Reset link nahi bhej paaye. Email check karo.</p>`:""}
      ${st==="stuck"?`<p class="mbug">${S.lang==="hi"?"Yahi bug hai: server ne error diya, par screen pe kuch nahi aaya. Button atka reh gaya.":"That's the bug: the server returned an error, but nothing showed. The button is stuck."}</p>`:""}
      <a class="mlink" data-pv="login">← Login</a>
      <p class="mhint">${S.lang==="hi"?"Try karo: sahi email, aur phir 'galat' likh ke.":"Try a valid email, then type 'wrong'."}</p></div>`;
  }
  return `<section class="card pg"><h5>${T(UI4.dHead)}</h5><p class="muted">${T(UI4.dLede)}</p>
    <div class="pvtabs">${tabs.map(([k,l])=>`<button data-pvview="${k}" aria-pressed="${v===k}">${T(l)}</button>`).join("")}</div>
    <div class="browser"><div class="bbar"><i></i><i></i><i></i><span>localhost:5173${v==="before"?"/login":url}</span></div><div class="bbody">${screen}</div></div></section>`;
}

function pgPromptText(){ const r=S.pg.run; if(!r) return ""; const d=r.diff.filter(([s])=>s!==" ").map(([s,t])=>(s==="+"?"+ ":"- ")+t).join("\n");
  return (S.lang==="hi"?"Maine sandbox mein ye badlaav try kiya. Isko project mein lagao, phir lint aur tests chalao:\n\n":"I tried this change in a sandbox. Apply it to the project, then run lint and tests:\n\n")+d; }

document.addEventListener("click",e=>{
  const line = e.target.closest("[data-ask]");
  if(line && !e.target.closest("button,a")){ S.ask = S.ask===line.dataset.ask ? null : line.dataset.ask; report(); return; }
  const b = e.target.closest("button,a,[data-node]"); if(!b) return;
  const x = S.view==="turn" ? turn() : null;
  if(b.dataset.lang){ S.lang=b.dataset.lang; all(); }
  else if(b.dataset.level){ S.level=b.dataset.level; S.bView=null; all(); }
  else if(b.dataset.turn){ S.view="turn"; S.turn=+b.dataset.turn; S.file=0; S.wireSel=null; S.step=0; S.bView=null; S.ask=null; S.claimsOpen=false; const t=turn(); S.followLive=t.live; S.cur=t.dur; all(); }
  else if(b.id==="ovBtn"){ S.view="overview"; all(); }
  else if(b.id==="themeBtn"){ const r=document.documentElement; r.dataset.theme = r.dataset.theme==="dark"?"light":"dark"; try{ localStorage.setItem("vx-theme", r.dataset.theme); }catch(err){} }
  else if(b.dataset.tab){ S.tab=b.dataset.tab; report(); }
  else if(b.dataset.step){ S.step=+b.dataset.step; S.bView=null; report(); window.scrollTo({top:$("#nav").offsetTop-10,behavior:"smooth"}); }
  else if(b.dataset.go){ S.step=+b.dataset.go; report(); window.scrollTo({top:$("#nav").offsetTop-10,behavior:"smooth"}); }
  else if(b.id==="finishBtn"){ S.done[S.turn]=true; rail(); report(); }
  else if(b.id==="backLesson"){ S.bView=null; report(); }
  else if(b.dataset.file){ S.file=+b.dataset.file; S.ask=null; report(); }
  else if(b.dataset.jump){ S.cur=+b.dataset.jump; S.followLive=false; S.stripOpen=true; if(S.level==="dev") S.tab = "logs"; else S.bView="live"; all(); }
  else if(b.dataset.node){ S.wireSel = S.wireSel===b.dataset.node?null:b.dataset.node; report(); }
  else if(b.dataset.q){ (S.quiz[S.turn] ||= {})[+b.dataset.q]=+b.dataset.o; report(); }
  else if(b.id==="followBtn"){ S.followLive=true; S.cur=turn().dur; all(); }
  else if(b.id==="tlToggle"){ S.stripOpen=!S.stripOpen; strip(); }
  else if(b.id==="claimsToggle"){ S.claimsOpen=!S.claimsOpen; report(); }
  else if(b.id==="runTests"){ const id=S.turn; S.tests[id]="running"; report(); setTimeout(()=>{ S.tests[id]="done"; if(S.turn===id) report(); }, 1600); }
  else if(b.dataset.copy){ const k=b.dataset.copy;
    const txt = k==="pgprompt" ? pgPromptText() : k.startsWith("todo:") ? T((todoItems(turn()).find(it=>"todo:"+it.k===k)||{}).p) : k==="claimfix" ? T(CLAIM_FIX[S.turn]) : k==="exp" ? exportText(S.exp) : T((IMPACT_PROMPTS[S.turn]||[])[+k.slice(3)]);
    copyText(txt,k); report(); }
  else if(b.dataset.exp){ S.exp = S.exp===b.dataset.exp?null:b.dataset.exp; report(); }
  else if(b.dataset.revise){ S.view="turn"; S.turn=+b.dataset.revise; S.level="beg"; S.step=5; S.bView=null; S.quiz[S.turn]={}; const t=turn(); S.cur=t.dur; all(); }
  else if(b.dataset.pgedit){ S.pg.hunk=b.dataset.pgedit; S.pg.run=null; S.pg.act=null; if(S.level==="dev") S.tab="play"; else { S.step=3; S.bView=null; } report(); window.scrollTo({top:$("#nav").offsetTop-10,behavior:"smooth"}); }
  else if(b.id==="pgRun"){ pgRun(); }
  else if(b.id==="pgReset"){ delete S.pg.code[S.pg.hunk]; S.pg.run=null; S.pg.act=null; report(); }
  else if(b.id==="pgApply"){ S.pg.act="confirm"; report(); }
  else if(b.id==="pgApplyYes"){ S.pg.act="applied"; report(); }
  else if(b.id==="pgApplyNo"){ S.pg.act=null; report(); }
  else if(b.id==="pgDiscard"){ delete S.pg.code[S.pg.hunk]; S.pg.run=null; S.pg.act="discarded"; report(); S.pg.act=null; }
  else if(b.dataset.pred){ const [i,j]=b.dataset.pred.split(":").map(Number); S.pg.pred[i]=j; report(); }
  else if(b.dataset.predrun){ S.pg.predRun[+b.dataset.predrun]=true; report(); }
  else if(b.id==="chCheck"){ const ch=S.pg.ch; const code = ch.showSol ? CHALLENGE[S.turn].solution : ch.code; ch.res = chCheck(code); if(ch.res.ok) ch.solved=true; report(); }
  else if(b.id==="chHint"){ S.pg.ch.hints++; report(); }
  else if(b.id==="chSol"){ S.pg.ch.showSol=true; S.pg.ch.code=CHALLENGE[S.turn].solution; report(); }
  else if(b.dataset.pvview){ S.pg.view=b.dataset.pvview; S.pg.pvState=null; if(S.pg.view==="before") S.pg.screen="login"; report(); }
  else if(b.dataset.pv){ S.pg.screen=b.dataset.pv; S.pg.pvState=null; report(); }
  else if(b.id==="pvSend"){ const v=($("#pvEmail")||{}).value||""; const bad = !v.includes("@") || /wrong|galat/i.test(v); S.pg.pvState = bad ? (S.pg.view==="mine"?"err":"stuck") : "sent"; report(); }
  else if(b.dataset.todo){ S.todo[b.dataset.todo]=!S.todo[b.dataset.todo]; report(); }
  else if(b.id==="chatFab"){ S.chatOpen=true; chatRender(); setTimeout(()=>{ const i=$("#chatIn"); if(i) i.focus(); },50); }
  else if(b.id==="chatClose"){ S.chatOpen=false; chatRender(); }
  else if(b.dataset.chatq){ chatAsk(T(CHAT_QA[+b.dataset.chatq].q)); }
  else if(b.id==="askSend"){ const o=$("#askOut"); if(o) o.hidden=false; }
  else if(b.id==="ebBtn"){ $("#ebOut").hidden=false; }
});
document.addEventListener("input",e=>{ if(e.target.id==="pgCode"){ S.pg.code[S.pg.hunk]=e.target.value; return; } if(e.target.id==="chCode"){ S.pg.ch.code=e.target.value; S.pg.ch.showSol=false; return; } });
document.addEventListener("change",e=>{ if(e.target.id==="pgPick"){ S.pg.hunk=e.target.value; S.pg.run=null; S.pg.act=null; report(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Tab" && e.target.classList && e.target.classList.contains("editor")){ e.preventDefault(); const t=e.target, s=t.selectionStart; t.value=t.value.slice(0,s)+"  "+t.value.slice(t.selectionEnd); t.selectionStart=t.selectionEnd=s+2; t.dispatchEvent(new Event("input",{bubbles:true})); } });
document.addEventListener("input",e=>{ if(e.target.id==="eb") $("#ebBtn").disabled = e.target.value.trim().length<10; });
document.addEventListener("keydown",e=>{
  const n = e.target.closest?.("[data-node]");
  if(n && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); n.click(); }
  if(e.target.id==="trace" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){
    e.preventDefault(); const x=turn(); S.followLive=false; S.cur=Math.max(0,Math.min(x.dur,S.cur+(e.key==="ArrowRight"?1:-1))); if(S.level!=="dev" && x.lesson) S.bView="live"; strip(); report();
  }
});
/* signature: scrub the recorder strip */
(function(){
  const tr = $("#trace"); let drag=false;
  const set = ev => { const r=tr.getBoundingClientRect(); const x=turn(); const dur=Math.max(x.live?Math.max(30,x.dur+6):x.dur,1);
    S.cur = Math.max(0,Math.min(x.dur, (ev.clientX-r.left)/r.width*dur)); S.followLive = x.live && S.cur>=x.dur-.5;
    if(S.level==="dev"){ if(!["live","logs"].includes(S.tab)) S.tab="live"; } else if(x.lesson) S.bView="live"; strip(); report(); };
  tr.addEventListener("pointerdown",ev=>{drag=true;tr.classList.add("drag");tr.setPointerCapture(ev.pointerId);set(ev);});
  tr.addEventListener("pointermove",ev=>{ if(drag) set(ev); });
  tr.addEventListener("pointerup",()=>{drag=false;tr.classList.remove("drag");});
})();
window.addEventListener("resize",()=>strip());

/* live simulation: turn 4 grows */
let li=0;
function pushLive(){
  const x = TURNS[3]; if(li>=LIVE_SCRIPT.length){ return; }
  const e = LIVE_SCRIPT[li++]; x.events.push(e); x.dur = e.t;
  if(e.ch==="edit"){ x.files.push({path:e.target,isNew:!!e.isNew,add:e.add,del:e.del,hunks:[{start:1,lines:[["+", S.lang==="hi"?"/* diff turn ke saath likha ja raha hai */":"/* diff is being written as the turn runs */"]],note:{beg:{hi:"Ye file abhi badli hai. Poora samjhaana turn khatam hone pe aayega.",en:"This file just changed. The full explanation comes when the turn ends."},dev:{hi:"Live diff; analysis Stop hook pe chalega.",en:"Live diff; analysis runs on the Stop hook."}}}]}); }
  if(S.turn===4 && S.view==="turn"){ if(S.followLive) S.cur=x.dur; all(); } else { rail(); strip(); }
  setTimeout(pushLive, 2600);
}
{ const [h,at]=location.hash.slice(1).split('@'); const [a,b]=(h||'').replace(/-?(dark|light)/,'').split('-');
  if(a==='dev'){ S.level='dev'; if(b) S.tab=b; } else if(a==='step'){ S.step=+b||0; } else if(a==='ov'){ S.view='overview'; } else if(a==='tests'){ S.tests[3]='done'; } else if(a==='pg'){ S.step=3; if(b==='run'){ S.pg.hunk='0:1'; S.pg.code['0:1']="export async function requestPasswordReset(email) {\n  const res = http.post('/auth/reset', { email });\n  if (!res.ok) {\n    throw new AuthError(res.status, 'Reset link nahi bhej paaye');\n  }\n  return true;\n}"; S.pg.demo=true; } if(b==='pred'){ S.pg.pred={0:0,1:1}; S.pg.predRun={0:true,1:true}; } if(b==='ch'){ S.pg.ch.code="async function onSubmit(e) {\n  e.preventDefault();\n  try {\n    await requestPasswordReset(email);\n    setSent(true);\n  } catch (err) {\n    setError('Reset link nahi bhej paaye. Email check karo.');\n  }\n}"; S.pg.ch.hints=1; S.pg.ch.res={ok:true,out:"✓ ResetPassword > shows an error when reset fails\nTests  3 passed (3)"}; S.pg.ch.solved=true; S.pg.view='mine'; S.pg.screen='reset'; S.pg.pvState='err'; } if(b==='pv'){ S.pg.view='after'; S.pg.screen='reset'; S.pg.pvState='stuck'; } }
  else if(a==='chat'){ S.chatOpen=true; S.chat=[{who:'me',t:T(CHAT_QA[0].q)},{who:'ai',t:T(CHAT_QA[0].a)}]; } else if(a==='ask'){ S.step=1; S.ask='3:0:0:4'; }
  if(at) S.cur=+at; if(location.search.includes('open')) S.stripOpen=true; }
all();
if(S.pg.demo) pgRun();
setTimeout(pushLive, 900);
