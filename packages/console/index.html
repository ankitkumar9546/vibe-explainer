<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>vibe-explainer</title>
<script>(function(){var t=null;try{t=localStorage.getItem("vx-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var q=new URLSearchParams(location.search).get("theme");if(q==="dark"||q==="light")t=q;document.documentElement.dataset.theme=t;})();</script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="mark"><span class="box" aria-hidden="true"><i></i></span>vibe-explainer</div>
  <label class="pick"><span class="sr" data-i="project"></span><select id="projectSel" aria-label="Project"></select></label>
  <label class="pick"><span class="sr" data-i="session"></span><select id="sessionSel" aria-label="Session"></select></label>
  <div class="spacer"></div>
  <div class="rec off" id="rec" aria-live="polite"><i></i><span id="recText"></span></div>
  <button class="themebtn" id="themeBtn" aria-label="Dark / light"><svg class="i moon"><use href="#i-moon"/></svg><svg class="i sun"><use href="#i-sun"/></svg></button>
  <div class="seg" role="group" aria-label="Language"><button data-lang="hi">Hinglish</button><button data-lang="en">English</button></div>
  <div class="seg" role="group" aria-label="Level"><button data-level="beg">Beginner</button><button data-level="dev">Developer</button></div>
</header>

<div class="body">
  <nav class="rail" aria-label="Prompts"><h3 data-i="turnsHead"></h3><div id="turns"></div></nav>
  <main class="report">
    <div id="head"></div>
    <section class="strip mini" id="strip" aria-label="Timeline" hidden>
      <h2 id="stripTitle"></h2>
      <div class="chans" aria-hidden="true">
        <div><svg class="i"><use href="#i-soch"/></svg><span data-i="chSoch"></span></div>
        <div><svg class="i"><use href="#i-read"/></svg><span data-i="chRead"></span></div>
        <div><svg class="i"><use href="#i-edit"/></svg><span data-i="chEdit"></span></div>
        <div><svg class="i"><use href="#i-run"/></svg><span data-i="chRun"></span></div>
      </div>
      <div class="trace" id="trace" role="slider" tabindex="0" aria-valuemin="0"></div>
      <div class="scale num" id="scale"></div>
    </section>
    <div id="nav"></div>
    <div id="content"></div>
  </main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-soch" viewBox="0 0 16 16"><path d="M4.5 11.5h-.2A2.8 2.8 0 0 1 4 6a3.6 3.6 0 0 1 7-.6 2.6 2.6 0 0 1 .8 5.1H7.5L5 13.5z"/></symbol>
  <symbol id="i-read" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/></symbol>
  <symbol id="i-run" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4.5 6.5l2 1.5-2 1.5M8 10h3.5"/></symbol>
  <symbol id="i-msg" viewBox="0 0 16 16"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></symbol>
  <symbol id="i-prompt" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 14c.6-2.8 2.6-4 5-4s4.4 1.2 5 4"/></symbol>
  <symbol id="t-live" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M4.2 11.8a5.4 5.4 0 0 1 0-7.6M11.8 4.2a5.4 5.4 0 0 1 0 7.6"/></symbol>
  <symbol id="t-logs" viewBox="0 0 16 16"><path d="M5 4h8M5 8h8M5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></symbol>
  <symbol id="t-changes" viewBox="0 0 16 16"><path d="M2.5 5h5M5 2.5v5M8.5 11.5h5"/><path d="M12 3L4 13" opacity=".5"/></symbol>
  <symbol id="t-seekho" viewBox="0 0 16 16"><path d="M1.5 6L8 3l6.5 3L8 9z"/><path d="M4 7.3v3.4c1 1 2.4 1.5 4 1.5s3-.5 4-1.5V7.3"/></symbol>
  <symbol id="t-impact" viewBox="0 0 16 16"><path d="M8 2l6 11H2z"/><path d="M8 6.5v3M8 11.5h.01"/></symbol>
  <symbol id="i-ok" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></symbol>
  <symbol id="i-unk" viewBox="0 0 16 16"><path d="M6 6a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2v.5M8 12h.01"/></symbol>
  <symbol id="i-bad" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
  <symbol id="i-half" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></symbol>
  <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 1.5l1.6 4.4 4.4 1.6-4.4 1.6L8 13.5l-1.6-4.4L2 7.5l4.4-1.6z"/></symbol>
</svg>
<script type="module" src="app.js"></script>
</body>
</html>
